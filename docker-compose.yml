# =============================================================================
# Ambientes QA y PRO — cada servidor con su propio backend/.env:
#   QA  -> DB_NAME=dbq_soporte_carteras_propias
#   PRO -> DB_NAME=dbp_soporte_carteras_propias
#
#   docker compose build --no-cache
#   docker compose up -d
#
# Imágenes compiladas (sin modo watch). Puertos en el host: web 7001, API/Swagger 7002.
# MySQL (3371) y Redis (3372) solo en 127.0.0.1 del servidor, nunca expuestos a la red.
# Las bases de las carteras (Soporte) requieren la VPN activa en el servidor.
# =============================================================================
name: soporte-carteras-propias

services:
  mysql:
    image: mysql:8.0
    container_name: soporte-carteras-propias-mysql
    # backend/.env es la única fuente de verdad: la imagen oficial exige
    # MYSQL_ROOT_PASSWORD/MYSQL_DATABASE, se arman desde DB_PASSWORD/DB_NAME.
    env_file:
      - path: ./backend/.env
        required: true
    entrypoint: ['sh', '-c', 'export MYSQL_ROOT_PASSWORD="$$DB_PASSWORD" MYSQL_DATABASE="$$DB_NAME"; exec docker-entrypoint.sh mysqld']
    # Solo en localhost de esta máquina (no expuesto a la red): DBeaver se conecta a localhost:3371.
    ports:
      - '127.0.0.1:3371:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p"$$DB_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: soporte-carteras-propias-redis
    # Solo en localhost de esta máquina (Redis no tiene contraseña): nunca publicarlo a la red.
    ports:
      - '127.0.0.1:3372:6379'
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
    image: soporte-carteras-propias-api:latest
    container_name: soporte-carteras-propias-api
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      # Dentro del contenedor la API siempre escucha en 3000 (nginx de `web` apunta a api:3000).
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Conexiones de Soporte con host localhost/127.0.0.1 -> máquina anfitriona.
      HOST_LOCAL_ALIAS: host.docker.internal
      # Dentro del contenedor la llave está en el volumen (abajo), no en la ruta del host.
      SSH_KEY_PATH: /run/secrets/bastion_key
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # Llave SSH del bastión (túnel de PostgreSQL): ruta real en SSH_KEY_PATH de backend/.env
      # (los comandos llevan --env-file backend/.env).
      - ${SSH_KEY_PATH:-/dev/null}:/run/secrets/bastion_key:ro
    ports:
      - '7002:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    image: soporte-carteras-propias-web:latest
    container_name: soporte-carteras-propias-web
    ports:
      - '7001:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data:
    name: soporte-carteras-propias-mysql-data

networks:
  default:
    name: soporte-carteras-propias-network
