server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de endurecimiento (Fase 7 — ver planing/06-seguridad-sesion.md). Se repiten
    # en cada `location` que define su propio `add_header`, porque nginx no las hereda.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # API: mismo origen que la app (/api -> contenedor `api`). Así la imagen sirve en
    # cualquier servidor sin conocer su URL, y el navegador no hace peticiones cruzadas.
    # `^~` evita que la regla de archivos estáticos (.js, .css...) capture rutas de la API.
    location ^~ /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Soporte espera hasta 30 s la ejecución de la sentencia.
        proxy_read_timeout 90s;
        client_max_body_size 10m;
    }

    # Archivos con hash en el nombre (chunk-XXXX.js, styles-XXXX.css...): cambian de nombre en
    # cada build, se pueden cachear sin límite. Si no existe, 404 (nunca index.html): así un
    # navegador con una versión vieja falla limpio y la app se recarga sola.
    location ~* \.(?:js|mjs|css|map|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
    }

    # index.html (y cualquier ruta de la SPA): siempre se revalida, para que tras un
    # despliegue el navegador tome de inmediato la versión nueva.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
    }
}
