<div class="flex min-h-screen items-center justify-center p-4">
  <p-card styleClass="w-full sm:w-auto sm:min-w-[320px] scp-login-card">
    <ng-template #title>
      <div class="flex items-center justify-center gap-2">
        <img src="favicon.ico" alt="" width="28" height="28" />
        <span>SCP</span>
      </div>
    </ng-template>
    <ng-template #subtitle>
      <div class="text-center">Soporte Carteras Propias</div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="enviar()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-1.5">
        <label for="usuario">Usuario</label>
        <input
          id="usuario"
          type="text"
          pInputText
          formControlName="usuario"
          autocomplete="username"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="password">Contraseña</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      <a routerLink="/recuperar-password" class="text-right text-sm">¿Olvidaste tu contraseña?</a>

      <p-button type="submit" label="Ingresar" [disabled]="form.invalid" styleClass="w-full" />
    </form>
  </p-card>
</div>
