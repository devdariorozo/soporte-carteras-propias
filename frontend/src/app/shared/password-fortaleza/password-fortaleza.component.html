<div class="flex flex-col gap-2 pt-1">
  <div class="flex items-center gap-2">
    <div class="flex flex-1 gap-1">
      @for (segmento of segmentos; track segmento) {
        <span
          class="h-1.5 flex-1 rounded-full"
          [class]="nivel() && segmento <= nivel()!.segmentos ? nivel()!.color : 'bg-surface-200 dark:bg-surface-700'"
        ></span>
      }
    </div>
    <span class="w-12 text-right text-xs font-medium" [class]="nivel()?.texto ?? 'text-surface-500'">
      {{ nivel()?.etiqueta ?? '' }}
    </span>
  </div>
  <ul class="flex flex-col gap-0.5 text-xs">
    @for (requisito of requisitos(); track requisito.etiqueta) {
      <li class="flex items-center gap-1.5" [class]="requisito.cumple ? 'text-green-600' : 'text-surface-500'">
        <i class="pi text-xs" [class]="requisito.cumple ? 'pi-check-circle' : 'pi-circle'"></i>
        {{ requisito.etiqueta }}
      </li>
    }
  </ul>
</div>
